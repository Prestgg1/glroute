name = "glroute"
version = "0.1.0"
target = "erlang"
description = "Lightweight parallel LLM router for Gleam - priority fallback and parallel fan-out over gdantic_ai"

licences = ["Apache-2.0"]
repository = { type = "github", user = "Prestgg1", repo = "glroute" }
links = [{ title = "GitHub", href = "https://github.com/Prestgg1/glroute" }]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
glon = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gdantic_ai = { path = "../gdantic_ai" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
